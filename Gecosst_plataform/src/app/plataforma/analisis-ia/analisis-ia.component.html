<main>


    <div id="container-analisis-ia">

        <div id="titulo">

            <h1>Análisis de IA</h1>



        </div>

        <div id="busqueda">

        </div>


        <form>

            <label for="">Seleccione un area para iniciar el analisis</label>
            <select class="form-select" aria-label="Default select example" [(ngModel)]="area_id" name="area_id" (change)="Analizar_IA()">
                <option selected>Open this select menu</option>
                <option *ngFor="let item of lista_nombres_areas" [ngValue]="item[0]">{{item[1]}}</option>
            </select>

            <label for="">seleccione el tipo de analisis a realizar</label>
            <select class="form-select" aria-label="Default select example" [(ngModel)]="analisis" name="analisis">
                <option selected>Open this select menu</option>
                <option value="Identificación de peligros">Identificación de peligros</option>
                <option value="Analisis de vulnerabilidad y amenazas">Analisis de vulnerabilidad y amenazas</option>
                <option value="Evaluación de riesgos">Evaluación de riesgos</option>
            </select>

            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Añadir instrucciones adicionales para el analisis</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" [(ngModel)]="adicionales" name="adicionales"></textarea>
            </div>

            <div id="barra-botones">

                <button type="button" class="btn btn-primary" [disabled]="habilitar_btn_analizar" (click)="respuesta_ia()">Realizar analisis</button>
                <button type="button" class="btn btn-success" [disabled]="habilitar_btn_guardado">Guardar analisis</button>


            </div>


        </form>

        <div id="resultadoIA">

            <div id="respuesta">

            </div>


        </div>



    </div>

    <app-barra-herramientas></app-barra-herramientas>


</main>
